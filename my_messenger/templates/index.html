<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Messenger Main</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        /* 기존 디자인 스타일은 그대로 완벽하게 유지됩니다 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .messenger-container { display: flex; width: 900px; height: 650px; background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); overflow: hidden; }
        .sidebar { width: 300px; background: #2f3e46; color: white; display: flex; flex-direction: column; }
        .profile-section { padding: 20px; background: #243036; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a4f59; }
        .profile-name { font-weight: bold; font-size: 16px; }
        .logout-btn { background: #e63946; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; text-decoration: none; }
        .friend-list { flex: 1; overflow-y: auto; padding: 10px; }
        .friend-item { padding: 12px; margin-bottom: 5px; background: #3a4f59; border-radius: 6px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .friend-item:hover { background: #4f6b78; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #f4f6f8; }
        .chat-header { padding: 20px; background: white; border-bottom: 1px solid #e1e4e8; font-weight: bold; font-size: 16px; color: #333; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 60%; }
        .message-wrapper.sent { align-self: flex-end; }
        .message-wrapper.received { align-self: flex-start; }
        .sender-name { font-size: 11px; color: #666; margin-bottom: 2px; padding: 0 4px; }
        .message { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-all; }
        .message.received { background: white; border-bottom: 1px solid #ddd; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); color: #333; }
        .message.sent { background: #0084ff; color: white; border-bottom-right-radius: 2px; }
        
        /* ⌨️ 하단 입력 영역: form 태그를 제거하고 div 구조로 매끄럽게 변경 */
        .chat-input-area { padding: 15px; background: white; border-top: 1px solid #e1e4e8; display: flex; gap: 10px; width: 100%; }
        .chat-input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; outline: none; font-size: 14px; }
        .send-btn { background: #0084ff; color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .send-btn:hover { background: #0066cc; }
    </style>
</head>
<body>

<div class="messenger-container">
    <div class="sidebar">
        <div class="profile-section">
            <span class="profile-name">👤 {{ username }}님</span>
            <a href="/logout" class="logout-btn">로그아웃</a>
        </div>
        <div class="friend-list">
            <div style="font-size: 12px; color: #8b9bb4; margin-bottom: 10px; padding-left: 5px;">채팅방 목록</div>
            <div class="friend-item">💬 오픈 채팅방 (전체 대화)</div>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">💬 오픈 채팅방</div>
        
        <div class="chat-messages">
            {% for msg in messages %}
                {% if msg.sender == username %}
                    <div class="message-wrapper sent">
                        <div class="message sent">{{ msg.content }}</div>
                    </div>
                {% else %}
                    <div class="message-wrapper received">
                        <div class="sender-name">{{ msg.sender }}</div>
                        <div class="message received">{{ msg.content }}</div>
                    </div>
                {% endif %}
            {% endfor %}
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="content" class="chat-input" placeholder="메시지를 입력하세요..." autocomplete="off">
            <button id="send-btn" class="send-btn">전송</button>
        </div>
    </div>
</div>

<script>
    // 1. 웹소켓 객체 초기화 및 연결
    const socket = io();
    const myName = "{{ username }}";

    const chatMessages = document.querySelector('.chat-messages');
    const inputField = document.getElementById('content');
    const sendBtn = document.getElementById('send-btn');

    // 스크롤을 최하단으로 정렬하는 함수
    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    scrollToBottom(); // 초기 로드 시 실행

    // 2. 메시지를 웹소켓 채널로 전송하는 함수
    function sendMessage() {
        const text = inputField.value.trim();
        if (text !== "") {
            // 서버의 'send_message' 리스너로 이벤트 전송
            socket.emit('send_message', { 'content': text });
            inputField.value = ""; // 입력란 비우기
        }
    }

    // 클릭 및 엔터 키 입력 시 전송 기능 매핑
    sendBtn.addEventListener('click', sendMessage);
    inputField.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // 3. 서버로부터 실시간 대화 브로드캐스트 신호 수신 시
    socket.on('receive_message', (data) => {
        const wrapper = document.createElement('div');
        
        if (data.sender === myName) {
            wrapper.className = 'message-wrapper sent';
            wrapper.innerHTML = `<div class="message sent">${data.content}</div>`;
        } else {
            wrapper.className = 'message-wrapper received';
            wrapper.innerHTML = `
                <div class="sender-name">${data.sender}</div>
                <div class="message received">${data.content}</div>
            `;
        }
        
        chatMessages.appendChild(wrapper);
        scrollToBottom(); // 새 메시지가 추가되면 스크롤 하단 이동
    });
</script>

</body>
</html>
